<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Cartones de Bingo</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; 
      color: #f8fafc; 
      margin: 0; 
      padding: 15px 10px; 
      background-color: #0d1b3e;
      background-image: url('1000050238.png');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
    
    h1 { color: #facc15; margin-bottom: 5px; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    p { margin-top: 0; color: #cbd5e1; font-size: 0.95rem; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    
    .search-box { 
      margin: 15px auto; 
      max-width: 320px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      background: rgba(30, 41, 59, 0.92);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .search-box input { 
      width: 100%; 
      box-sizing: border-box;
      padding: 12px; 
      font-size: 1.1rem; 
      border: 2px solid #334155; 
      border-radius: 8px; 
      background: #1e293b; 
      color: #fff; 
      outline: none; 
      text-align: center; 
    }
    .search-box input:focus { border-color: #38bdf8; }
    .search-box button { 
      width: 100%;
      box-sizing: border-box;
      padding: 12px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      border: none; 
      border-radius: 8px; 
      background: #38bdf8; 
      color: #0f172a; 
      cursor: pointer; 
    }

    .card-title { font-size: 1.8rem; font-weight: bold; color: #f8fafc; margin: 15px 0 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    
    .card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 360px; margin: 10px auto; background: rgba(30, 41, 59, 0.95); padding: 12px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .cell { background: #334155; border: 1px solid #475569; padding: 14px 2px; font-weight: bold; font-size: 1.5rem; cursor: pointer; user-select: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; }
    .cell.header { background: #facc15; color: #0f172a; font-size: 1.5rem; font-weight: 900; border: none; cursor: default; }
    .cell.marked { background: #ef4444 !important; color: #fff !important; border-color: #dc2626 !important; border-radius: 50%; }
    .cell.free { background: #22c55e; color: #fff; font-size: 2.3rem; border: none; }
    
    .actions { margin-top: 15px; }
    .btn-reset { background: #475569; color: #fff; border: none; padding: 8px 16px; font-size: 0.9rem; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Buscador de Cartones</h1>
  <p>Ingresa el número de tu cartón para jugarlo</p>

  <div class="search-box">
    <input type="number" id="numCarton" placeholder="Ejemplo: 56" min="1" max="5000">
    <button type="button" onclick="buscarCarton()">Buscar</button>
  </div>

  <div id="contenido-carton" style="display: none;">
    <div class="card-title" id="titulo-carton">Cartón #--</div>
    <div id="bingo-card" class="card"></div>
    <div class="actions">
      <button class="btn-reset" type="button" onclick="limpiarMarcas()">Limpiar Marcas</button>
    </div>
  </div>

  <script>
    function pseudoRandom(seed) {
      let value = seed;
      return function() {
        value = (value * 9301 + 49297) % 233280;
        return value / 233280;
      };
    }

    function buscarCarton() {
      const input = document.getElementById("numCarton").value;
      const numero = parseInt(input);

      if (!numero || numero < 1) {
        alert("Por favor ingresa un número de cartón válido.");
        return;
      }

      document.getElementById("titulo-carton").innerText = "Cartón #" + numero;
      document.getElementById("contenido-carton").style.display = "block";

      const rng = pseudoRandom(numero);
      const container = document.getElementById("bingo-card");
      container.innerHTML = "";

      const headers = ['B', 'I', 'N', 'G', 'O'];
      headers.forEach(h => {
        const div = document.createElement("div");
        div.className = "cell header";
        div.innerText = h;
        container.appendChild(div);
      });

      const columnas = [
        obtenerNumerosSemilla(1, 15, 5, rng),
        obtenerNumerosSemilla(16, 30, 5, rng),
        obtenerNumerosSemilla(31, 45, 5, rng),
        obtenerNumerosSemilla(46, 60, 5, rng),
        obtenerNumerosSemilla(61, 75, 5, rng)
      ];

      for (let fila = 0; fila < 5; fila++) {
        for (let col = 0; col < 5; col++) {
          const cell = document.createElement("div");
          cell.className = "cell";

          if (fila === 2 && col === 2) {
            cell.innerText = "PL";
            cell.classList.add("free", "marked");
          } else {
            cell.innerText = columnas[col][fila];
            cell.onclick = function() {
              this.classList.toggle("marked");
            };
          }
          container.appendChild(cell);
        }
      }
    }

    function obtenerNumerosSemilla(min, max, cantidad, rng) {
      const numeros = [];
      while (numeros.length < cantidad) {
        const num = Math.floor(rng() * (max - min + 1)) + min;
        if (!numeros.includes(num)) numeros.push(num);
      }
      return numeros;
    }

    function limpiarMarcas() {
      const celdas = document.querySelectorAll(".cell:not(.header):not(.free)");
      celdas.forEach(celda => celda.classList.remove("marked"));
    }
  </script>

</body>
</html>
