<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Cartones de Bingo</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; 
      color: #f8fafc; 
      margin: 0; 
      padding: 15px 10px; 
      background-color: #0d1b3e;
      background-image: url('1000050238.png');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
    
    h1 { color: #facc15; margin-bottom: 5px; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    p { margin-top: 0; color: #cbd5e1; font-size: 0.95rem; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    
    .search-box { 
      margin: 15px auto; 
      max-width: 320px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      background: rgba(30, 41, 59, 0.92);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .search-box input { 
      width: 100%; 
      box-sizing: border-box;
      padding: 12px; 
      font-size: 1.1rem; 
      border: 2px solid #334155; 
      border-radius: 8px; 
      background: #1e293b; 
      color: #fff; 
      outline: none; 
      text-align: center; 
    }
    .search-box input:focus { border-color: #38bdf8; }
    .search-box button { 
      width: 100%;
      box-sizing: border-box;
      padding: 12px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      border: none; 
      border-radius: 8px; 
      background: #38bdf8; 
      color: #0f172a; 
      cursor: pointer; 
    }

    .cards-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      margin-top: 15px;
    }

    .card-container {
      width: 100%;
      max-width: 360px;
    }

    .card-title { font-size: 1.3rem; font-weight: bold; color: #f8fafc; margin: 15px 0 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    
    .card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 360px; margin: 10px auto; background: rgba(30, 41, 59, 0.95); padding: 12px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .cell { background: #334155; border: 1px solid #475569; padding: 14px 2px; font-weight: bold; font-size: 1.1rem; cursor: pointer; user-select: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; }
    .cell.header { background: #facc15; color: #0f172a; font-size: 1.3rem; font-weight: 900; border: none; cursor: default; }
    .cell.marked { background: #ef4444 !important; color: #fff !important; border-color: #dc2626 !important; border-radius: 50%; }
    .cell.free { background: #22c55e; color: #fff; font-size: 0.85rem; border: none; }
    
    .actions { margin-top: 15px; }
    .btn-reset { background: #475569; color: #fff; border: none; padding: 8px 16px; font-size: 0.9rem; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Buscador de Cartones</h1>
  <p>Ingresa cartones (Ej: 5 ó 3, 8, 12)</p>

  <div class="search-box">
    <input type="text" id="numCarton" placeholder="Ej: 5 ó 3, 8, 12" autocomplete="off">
    <button type="button" onclick="buscarCartones()">Buscar</button>
  </div>

  <div id="contenido-carton" style="display: none;">
    <div class="actions">
      <button class="btn-reset" type="button" onclick="limpiarMarcas()">Limpiar Marcas</button>
    </div>
    <div id="cards-wrapper" class="cards-wrapper"></div>
  </div>

  <script>
    function pseudoRandom(seed) {
      let value = seed;
      return function() {
        value = (value * 9301 + 49297) % 233280;
        return value / 233280;
      };
    }

    function procesarEntradaCartones(texto) {
      const lista = [];
      if (!texto) return lista;
      const partes = texto.split(',');

      partes.forEach(p => {
        const num = parseInt(p.trim());
        if (!isNaN(num) && num > 0 && !lista.includes(num)) {
          lista.push(num);
        }
      });

      return lista;
